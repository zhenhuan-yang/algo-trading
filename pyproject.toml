[project]
name = "algo-trading"
version = "0.0.1"
description = "Quantitative trading project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "yfinance>=0.2.66",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "alpaca-py>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26.0", "quantstats>=0.0.62"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
